<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sugar Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#fff3e0;
    --bg-bottom:#ffe0ec;
    --panel:#ffffff;
    --panel-edge:#ffd7e6;
    --ink:#5b3a52;
    --ink-dim:#a8879e;
    --accent:#ff6f91;
    --gold:#ffb238;
    --c0:#ff6f91;
    --c1:#ffb238;
    --c2:#7ed957;
    --c3:#4fc3f7;
    --c4:#c67ef0;
    --c5:#ff8a5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }
  .stage{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px 14px 0;
  }
  .headline{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:26px;
    margin:4px 0 2px;
    color:var(--accent);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .headline span{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--ink-dim);
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin:14px 0 10px;
  }
  .stat{
    flex:1;
    background:var(--panel);
    border-radius:16px;
    padding:10px 14px;
    border:2px solid var(--panel-edge);
  }
  .stat b{
    display:block;
    font-family:'Fredoka', sans-serif;
    font-size:22px;
    line-height:1.1;
  }
  .stat small{
    color:var(--ink-dim);
    font-size:11px;
    font-weight:800;
  }
  .stat.level b{ color:var(--accent); }
  .stat.moves b{ color:var(--c3); }
  .stat.score b{ color:var(--c1); }

  .goal-line{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    font-weight:800;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .goal-track{
    height:10px;
    border-radius:6px;
    background:#ffffff;
    border:2px solid var(--panel-edge);
    overflow:hidden;
    margin-bottom:16px;
  }
  .goal-fill{
    height:100%;
    border-radius:4px;
    background:linear-gradient(90deg, var(--c1), var(--accent));
    width:0%;
    transition:width 0.35s ease;
  }

  .board-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:var(--panel);
    border-radius:22px;
    padding:8px;
    box-shadow:0 12px 24px rgba(255,111,145,0.18);
    border:2px solid var(--panel-edge);
  }
  #board{
    position:relative;
    width:100%;
    height:100%;
  }
  .cell{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: top 0.22s cubic-bezier(.4,1.4,.6,1), left 0.18s ease;
  }
  .gem{
    width:82%;
    height:82%;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition: transform 0.16s ease, opacity 0.18s ease;
    box-shadow: inset 0 -5px 6px rgba(0,0,0,0.15), inset 0 3px 5px rgba(255,255,255,0.6);
  }
  .cell.selected .gem{ transform:scale(0.86); box-shadow:0 0 0 3px var(--accent), inset 0 -4px 6px rgba(0,0,0,0.15); }
  .cell.matched .gem{ transform:scale(0.2) rotate(30deg); opacity:0; }
  .gem::after{
    content:"";
    position:absolute;
    width:34%; height:34%;
    top:14%; left:16%;
    background:rgba(255,255,255,0.75);
    border-radius:50%;
    filter:blur(0.5px);
  }
  .g0{ background:radial-gradient(circle at 35% 30%, #ffa6bd, var(--c0)); }
  .g1{ background:radial-gradient(circle at 35% 30%, #ffd27a, var(--c1)); }
  .g2{ background:radial-gradient(circle at 35% 30%, #b6f0a0, var(--c2)); }
  .g3{ background:radial-gradient(circle at 35% 30%, #a6e3ff, var(--c3)); }
  .g4{ background:radial-gradient(circle at 35% 30%, #e2b8fb, var(--c4)); }
  .g5{ background:radial-gradient(circle at 35% 30%, #ffc09e, var(--c5)); }

  .controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:16px 0 10px;
  }
  button.restart{
    background:var(--panel);
    border:2px solid var(--panel-edge);
    color:var(--accent);
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:14px;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
  }
  button.restart:active{ background:var(--bg-top); }

  .ad-slot{
    margin-top:auto;
    width:100%;
    min-height:50px;
    border-radius:10px;
    border:2px dashed var(--panel-edge);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-dim);
    font-size:11px;
    margin-bottom:14px;
    padding:6px;
    text-align:center;
    background:rgba(255,255,255,0.5);
  }

  .overlay{
    position:fixed; inset:0;
    background:rgba(91,58,82,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--panel);
    border-radius:20px;
    padding:28px 24px;
    text-align:center;
    max-width:320px;
    border:2px solid var(--panel-edge);
  }
  .modal h2{
    font-family:'Fredoka', sans-serif;
    margin:0 0 8px;
    font-size:24px;
    color:var(--accent);
  }
  .modal p{ color:var(--ink-dim); margin:0 0 20px; line-height:1.5; font-weight:700; }
  .modal button{
    background:linear-gradient(150deg, var(--gold), #ff8a3d);
    border:none;
    color:#5b3a1a;
    font-family:'Nunito', sans-serif;
    font-weight:800;
    padding:12px 28px;
    border-radius:999px;
    font-size:15px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="headline">Sugar Rush <span>endless candy match</span></div>

  <div class="stat-row">
    <div class="stat level"><small>ROUND</small><b id="levelVal">1</b></div>
    <div class="stat moves"><small>MOVES LEFT</small><b id="movesVal">20</b></div>
    <div class="stat score"><small>TOTAL SCORE</small><b id="scoreVal">0</b></div>
  </div>
  <div class="goal-line"><span id="goalLabel">Round goal</span><span id="goalNums">0 / 500</span></div>
  <div class="goal-track"><div class="goal-fill" id="goalFill"></div></div>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <div class="controls">
    <button class="restart" id="restartBtn">Restart run</button>
  </div>

  <div class="ad-slot" id="adSlot">Ad banner space (connect AdMob here)</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Round cleared!</h2>
    <p id="modalText">On to the next round.</p>
    <button id="modalBtn">Continue</button>
  </div>
</div>

<script>
(function(){
  const SIZE = 8;
  const GEM_TYPES = 6;
  const BASE_MOVES = 20;
  const BASE_TARGET = 500;
  const TARGET_STEP = 150;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('scoreVal');
  const movesEl = document.getElementById('movesVal');
  const levelEl = document.getElementById('levelVal');
  const goalFill = document.getElementById('goalFill');
  const goalNums = document.getElementById('goalNums');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalBtn = document.getElementById('modalBtn');
  const restartBtn = document.getElementById('restartBtn');

  let grid = [];
  let cellEls = [];
  let level = 1;
  let totalScore = 0;
  let roundScore = 0;
  let roundTarget = BASE_TARGET;
  let moves = BASE_MOVES;
  let selected = null;
  let busy = false;
  let gameOver = false;
  let mode = 'clear'; // 'clear' round-cleared modal, 'over' game-over modal

  function randGem(){ return Math.floor(Math.random() * GEM_TYPES); }
  function idx(r,c){ return r*SIZE + c; }

  function currentTarget(){ return BASE_TARGET + (level-1) * TARGET_STEP; }
  function currentMoves(){ return Math.max(14, BASE_MOVES - Math.floor((level-1)/3)); }

  function buildInitialGrid(){
    grid = new Array(SIZE*SIZE).fill(0);
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        let g, tries=0;
        do {
          g = randGem();
          tries++;
        } while(
          tries < 20 && (
            (c>=2 && grid[idx(r,c-1)]===g && grid[idx(r,c-2)]===g) ||
            (r>=2 && grid[idx(r-1,c)]===g && grid[idx(r-2,c)]===g)
          )
        );
        grid[idx(r,c)] = g;
      }
    }
  }

  function layout(){
    const wrapWidth = boardEl.clientWidth;
    const cellSize = wrapWidth / SIZE;
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const el = cellEls[idx(r,c)];
        el.style.width = cellSize+'px';
        el.style.height = cellSize+'px';
        el.style.left = (c*cellSize)+'px';
        el.style.top = (r*cellSize)+'px';
      }
    }
  }

  function renderAll(){
    boardEl.innerHTML = '';
    cellEls = [];
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r;
        cell.dataset.c = c;
        const gem = document.createElement('div');
        gem.className = 'gem g' + grid[idx(r,c)];
        cell.appendChild(gem);
        cell.addEventListener('click', onCellClick);
        boardEl.appendChild(cell);
        cellEls[idx(r,c)] = cell;
      }
    }
    layout();
  }

  function setGemType(r,c,type){
    const cell = cellEls[idx(r,c)];
    cell.innerHTML = '';
    const gem = document.createElement('div');
    gem.className = 'gem g' + type;
    cell.appendChild(gem);
  }

  function findMatches(){
    const toClear = new Set();
    for(let r=0;r<SIZE;r++){
      let runStart = 0;
      for(let c=1;c<=SIZE;c++){
        const cur = c<SIZE ? grid[idx(r,c)] : -1;
        const prev = grid[idx(r,c-1)];
        if(cur !== prev){
          if(c - runStart >= 3){ for(let k=runStart;k<c;k++) toClear.add(idx(r,k)); }
          runStart = c;
        }
      }
    }
    for(let c=0;c<SIZE;c++){
      let runStart = 0;
      for(let r=1;r<=SIZE;r++){
        const cur = r<SIZE ? grid[idx(r,c)] : -1;
        const prev = grid[idx(r-1,c)];
        if(cur !== prev){
          if(r - runStart >= 3){ for(let k=runStart;k<r;k++) toClear.add(idx(k,c)); }
          runStart = r;
        }
      }
    }
    return toClear;
  }

  function updateHud(){
    levelEl.textContent = level;
    scoreEl.textContent = totalScore;
    movesEl.textContent = Math.max(0, moves);
    const pct = Math.min(100, Math.round((roundScore/roundTarget)*100));
    goalFill.style.width = pct + '%';
    goalNums.textContent = roundScore + ' / ' + roundTarget;
  }

  function wait(ms){ return new Promise(res=>setTimeout(res, ms)); }

  async function resolveMatches(){
    let chainMultiplier = 1;
    while(true){
      const matches = findMatches();
      if(matches.size === 0) break;

      matches.forEach(i => cellEls[i].classList.add('matched'));
      const gained = matches.size * 10 * chainMultiplier;
      roundScore += gained;
      totalScore += gained;
      updateHud();
      await wait(220);

      for(let c=0;c<SIZE;c++){
        const colVals = [];
        for(let r=SIZE-1;r>=0;r--){
          if(!matches.has(idx(r,c))) colVals.push(grid[idx(r,c)]);
        }
        while(colVals.length < SIZE) colVals.push(randGem());
        for(let r=SIZE-1;r>=0;r--){
          grid[idx(r,c)] = colVals[SIZE-1-r];
        }
      }

      for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
          cellEls[idx(r,c)].classList.remove('matched');
          setGemType(r,c,grid[idx(r,c)]);
        }
      }
      chainMultiplier++;
      await wait(120);
    }
  }

  function swapGrid(r1,c1,r2,c2){
    const tmp = grid[idx(r1,c1)];
    grid[idx(r1,c1)] = grid[idx(r2,c2)];
    grid[idx(r2,c2)] = tmp;
    setGemType(r1,c1, grid[idx(r1,c1)]);
    setGemType(r2,c2, grid[idx(r2,c2)]);
  }

  function areAdjacent(a,b){
    const dr = Math.abs(a.r-b.r), dc = Math.abs(a.c-b.c);
    return (dr+dc) === 1;
  }

  function showRoundClearedModal(){
    gameOver = true;
    mode = 'clear';
    modalTitle.textContent = 'Round ' + level + ' cleared!';
    modalText.textContent = 'Great match streak — total score ' + totalScore + '. Ready for round ' + (level+1) + '?';
    modalBtn.textContent = 'Next round';
    overlay.classList.add('show');
  }

  function showGameOverModal(){
    gameOver = true;
    mode = 'over';
    modalTitle.textContent = 'Out of moves';
    modalText.textContent = 'You reached round ' + level + ' with a total score of ' + totalScore + '. Start a new run?';
    modalBtn.textContent = 'Start new run';
    overlay.classList.add('show');
  }

  function checkEndState(){
    if(roundScore >= roundTarget){
      showRoundClearedModal();
    } else if(moves <= 0){
      showGameOverModal();
    }
  }

  function beginRound(newLevel){
    level = newLevel;
    roundTarget = currentTarget();
    moves = currentMoves();
    roundScore = 0;
    gameOver = false;
    overlay.classList.remove('show');
    buildInitialGrid();
    let guard = 0;
    while(findMatches().size > 0 && guard < 50){
      findMatches().forEach(i => { grid[i] = randGem(); });
      guard++;
    }
    renderAll();
    updateHud();
  }

  function startNewRun(){
    totalScore = 0;
    beginRound(1);
  }

  async function onCellClick(e){
    if(busy || gameOver) return;
    const cell = e.currentTarget;
    const r = parseInt(cell.dataset.r,10);
    const c = parseInt(cell.dataset.c,10);

    if(!selected){
      selected = {r,c,el:cell};
      cell.classList.add('selected');
      return;
    }
    if(selected.r === r && selected.c === c){
      cell.classList.remove('selected');
      selected = null;
      return;
    }
    if(!areAdjacent(selected, {r,c})){
      selected.el.classList.remove('selected');
      selected = {r,c,el:cell};
      cell.classList.add('selected');
      return;
    }

    busy = true;
    const prevSel = selected;
    prevSel.el.classList.remove('selected');
    selected = null;

    swapGrid(prevSel.r, prevSel.c, r, c);
    await wait(160);

    const matches = findMatches();
    if(matches.size === 0){
      swapGrid(prevSel.r, prevSel.c, r, c);
      await wait(160);
      busy = false;
      return;
    }

    moves--;
    updateHud();
    await resolveMatches();
    busy = false;
    checkEndState();
  }

  modalBtn.addEventListener('click', () => {
    if(mode === 'clear'){
      beginRound(level + 1);
    } else {
      startNewRun();
    }
  });
  restartBtn.addEventListener('click', startNewRun);
  window.addEventListener('resize', layout);

  startNewRun();
})();
</script>
</body>
</html>
